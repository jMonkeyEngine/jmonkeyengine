######################################################################################
# JME CI/CD
######################################################################################
# Quick overview of what is going on in this script:
#   - Build the engine, create the zip release, maven artifacts and javadoc
#   - (only when building a release) Deploy everything else to github releases and Sonatype
#   - (only when building a release) Update javadoc.jmonkeyengine.org
# Note:
#   All the actions/upload-artifact and actions/download-artifact steps are used to pass
#   stuff between jobs, github actions has some sort of storage that is local to the
#   running workflow, we use it to store the result of each job since the filesystem
#   is not maintained between jobs.
################# CONFIGURATIONS #####################################################
# >> Configure SONATYPE RELEASE
#     CENTRAL_PASSWORD=XXXXXX
#     CENTRAL_USERNAME=XXXXXX
# >> Configure SIGNING
#     SIGNING_KEY=XXXXXX
#     SIGNING_PASSWORD=XXXXXX
# >> Configure  PACKAGE REGISTRY RELEASE
#   Nothing to do here, everything is autoconfigured to work with the account/org that
#   is running the build.
# >> Configure  JAVADOC
#     JAVADOC_GHPAGES_REPO="riccardoblsandbox/javadoc.jmonkeyengine.org.git"
#   Generate a deploy key
#       ssh-keygen -t rsa -b 4096 -C "actions@users.noreply.github.com" -f javadoc_deploy
#   Set
#     JAVADOC_GHPAGES_DEPLOY_PRIVKEY="......."
#   In github repo -> Settings, use javadoc_deploy.pub as Deploy key with write access
######################################################################################
# Resources:
#   - Github actions docs: https://help.github.com/en/articles/about-github-actions
#   - Package registry docs: https://help.github.com/en/articles/about-github-package-registry
#   - Official actions: https://github.com/actions
#   - Community actions: https://github.com/sdras/awesome-actions
######################################################################################
# - Riccardo Balbo
######################################################################################

name: Build jMonkeyEngine
on:
  push:
    branches:
      - master
      - v3.7
      - v3.6
      - v3.5
      - v3.4
      - v3.3
      - ios
  pull_request:
  release:
    types: [published]

jobs:
  Checkstyle:
    name: Run Checkstyle
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup the java environment
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Run Checkstyle
        run: |
          ./gradlew checkstyleMain checkstyleTest --console=plain --stacktrace
      - name: Upload Checkstyle Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checkstyle-report
          retention-days: 30
          path: |
            **/build/reports/checkstyle/**

  SpotBugs:
    name: Run SpotBugs
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup the java environment
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Run SpotBugs
        run: |
          ./gradlew -PenableSpotBugs=true spotbugsMain spotbugsTest --console=plain --stacktrace
      - name: Upload SpotBugs Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-report
          retention-days: 30
          path: |
            **/build/reports/spotbugs/**

  JavadocDoclint:
    name: Run Javadoc Doclint
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup the java environment
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Run Javadoc doclint
        run: |
          ./gradlew -PenableJavadocError=true javadoc mergedJavadoc --console=plain --stacktrace
      - name: Report Javadoc doclint failure
        if: failure()
        run: |
          echo "::notice title=Javadoc doclint failed::Javadoc warnings were found. Run ./gradlew -PenableJavadocError=true javadoc mergedJavadoc locally to reproduce."

  ScreenshotTests:
    name: Run Screenshot Tests (${{ matrix.renderer }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/onemillionworlds/opengl-docker-image:v1
    strategy:
      fail-fast: false
      matrix:
        renderer: [opengl, angle]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup the java environment
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Start display server
        run: |
          # The lavapipe ICD file was renamed from lvp_icd.x86_64.json to lvp_icd.json in
          # newer Mesa releases; resolve it dynamically here so every later step
          # (including Report GL/Vulkan below) sees the right file.
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)
          if [ -n "$ICD" ]; then
            echo "Using Vulkan ICD: $ICD"
            echo "VK_ICD_FILENAMES=$ICD" >> $GITHUB_ENV
            export VK_ICD_FILENAMES="$ICD"
          else
            echo "::warning::No lavapipe ICD found under /usr/share/vulkan/icd.d/"
          fi
          if [ "${{ matrix.renderer }}" = "angle" ]; then
            # The ANGLE binaries used by jME have no EGL X11 platform support, so run them
            # on a headless Wayland compositor instead of Xvfb.
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq weston
            mkdir -p /tmp/runtime-root
            chmod 700 /tmp/runtime-root
            # Export in this shell too: weston is started below, in this same step.
            export XDG_RUNTIME_DIR=/tmp/runtime-root
            export XDG_SESSION_TYPE=wayland
            export WAYLAND_DISPLAY=wayland-1
            # Force SDL onto Wayland even if a DISPLAY lingers in the container env.
            export SDL_VIDEODRIVER=wayland
            echo "XDG_RUNTIME_DIR=/tmp/runtime-root" >> $GITHUB_ENV
            echo "XDG_SESSION_TYPE=wayland" >> $GITHUB_ENV
            echo "WAYLAND_DISPLAY=wayland-1" >> $GITHUB_ENV
            echo "SDL_VIDEODRIVER=wayland" >> $GITHUB_ENV
            # The container sets DISPLAY=:99 and zink overrides for the OpenGL run;
            # ANGLE talks to Vulkan directly, so drop them to avoid any interference.
            unset DISPLAY MESA_LOADER_DRIVER_OVERRIDE GALLIUM_DRIVER VK_DRIVER_FILES
            echo "DISPLAY=" >> $GITHUB_ENV
            echo "MESA_LOADER_DRIVER_OVERRIDE=" >> $GITHUB_ENV
            echo "GALLIUM_DRIVER=" >> $GITHUB_ENV
            echo "VK_DRIVER_FILES=" >> $GITHUB_ENV
            weston --backend=headless --socket=wayland-1 --idle-time=0 --width=1024 --height=768 &
            echo $! > /tmp/weston.pid
            sleep 2
          else
            Xvfb :99 -ac -screen 0 1024x768x16 &
            export DISPLAY=:99
            echo "DISPLAY=:99" >> $GITHUB_ENV
          fi
      - name: Report GL/Vulkan
        run: |
          set -x
          echo "renderer=${{ matrix.renderer }}"
          echo "DISPLAY=$DISPLAY"
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
          echo "XDG_SESSION_TYPE=$XDG_SESSION_TYPE"
          echo "SDL_VIDEODRIVER=$SDL_VIDEODRIVER"
          glxinfo | grep -E "OpenGL version|OpenGL renderer|OpenGL vendor" || true
          vulkaninfo --summary || true
          echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          echo "MESA_LOADER_DRIVER_OVERRIDE=$MESA_LOADER_DRIVER_OVERRIDE"
          echo "GALLIUM_DRIVER=$GALLIUM_DRIVER"
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Test with Gradle Wrapper
        run: |
          if [ "${{ matrix.renderer }}" = "angle" ]; then
            TASK=screenshotTestAngle
          else
            TASK=screenshotTest
          fi
          restart_display_server() {
            if [ "${{ matrix.renderer }}" = "angle" ]; then
              # Kill the exact weston we started (PID saved by the Start step),
              # not anything matching a pattern.
              if [ -f /tmp/weston.pid ]; then
                kill "$(cat /tmp/weston.pid)" 2>/dev/null || true
              fi
              sleep 1
              # Same env discipline as the Start step: weston must not see a stale
              # DISPLAY, and SDL must stay on Wayland.
              unset DISPLAY MESA_LOADER_DRIVER_OVERRIDE GALLIUM_DRIVER VK_DRIVER_FILES
              export SDL_VIDEODRIVER=wayland
              weston --backend=headless --socket=wayland-1 --idle-time=0 --width=1024 --height=768 &
              echo $! > /tmp/weston.pid
              sleep 2
            else
              # A corrupted X server state (e.g. BadLength on X_PutImage) persists for the
              # life of the server, so give each retry a fresh display.
              pkill Xvfb || true
              sleep 2
              Xvfb :99 -ac -screen 0 1024x768x16 &
              sleep 2
            fi
          }
          for attempt in 1 2 3; do
            echo "Screenshot test (${{ matrix.renderer }}) attempt $attempt of 3"
            if ./gradlew :jme3-screenshot-tests:jme3-screenshot-tests-desktop:$TASK; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, retrying..."
              # Stop any crashed/lingering Gradle daemons so a failed JVM
              # (e.g. an X_PutImage Xlib crash) cannot poison the next attempt.
              ./gradlew --stop || true
              restart_display_server
            fi
          done
          echo "All 3 attempts failed."
          exit 1
      - name: Report Screenshot Test failure
        if: failure()
        run: |
          echo "::error title=Screenshot tests (${{ matrix.renderer }}) failed::For details download the 'screenshot-test-report-${{ matrix.renderer }}' artifact and open jme3-screenshot-tests/build/reports/ScreenshotDiffReport.html. If you intended to change visuals: review jme3-screenshot-tests/build/changed-images and commit replacements to jme3-screenshot-tests/src/test/resources (files ending in _angle.png for the ANGLE run). See https://github.com/jMonkeyEngine/jmonkeyengine/blob/master/jme3-screenshot-tests/README.md"
      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-test-report-${{ matrix.renderer }}
          retention-days: 30
          path: |
            **/build/reports/**
            **/build/changed-images/**
            **/build/test-results/**

  TestIOSBuild:
    name: Test iOS build
    runs-on: macos-latest
    steps:
      - name: Clone the repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup the java environment
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: 25
          
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
    
      - name: Build iOS examples
        shell: bash
        run: |
         ./gradlew :jme3-ios-examples:buildIosSimulatorApp
         
  # Build the engine, we only deploy from ubuntu-latest jdk25
  BuildJMonkey:
    name: Build on ${{ matrix.osName }} jdk${{ matrix.jdk }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        jdk: [25]
        include:
          - os: ubuntu-latest
            osName: linux
            deploy: true
          - os: windows-latest
            osName: windows
            deploy: false
          - os: macOS-latest
            osName: mac
            deploy: false

    steps:
      - name: Clone the repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup the java environment
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Build Engine
        shell: bash
        run: |
          # Normal build plus ZIP distribution and merged javadoc
          ./gradlew -PuseCommitHashAsVersionName=true \
          -x checkstyleMain -x checkstyleTest \
          build createZipDistribution mergedJavadoc

          if [ "${{ matrix.deploy }}" = "true" ];
          then
            # We are going to need "zip"
            sudo apt-get update
            sudo apt-get install -y zip

            # We prepare the release for deploy
            mkdir -p ./dist/release/
            mv build/distributions/*.zip dist/release/

            # Install maven artifacts to ./dist/maven and sign them if possible
            if [ "${{ secrets.SIGNING_PASSWORD }}" = "" ];
            then
              echo "Configure the following secrets to enable signing:"
              echo "SIGNING_KEY, SIGNING_PASSWORD"

              ./gradlew publishMavenPublicationToDistRepository \
              -PuseCommitHashAsVersionName=true \
              --console=plain --stacktrace
            else
              ./gradlew publishMavenPublicationToDistRepository \
              -PsigningKey='${{ secrets.SIGNING_KEY }}' \
              -PsigningPassword='${{ secrets.SIGNING_PASSWORD }}' \
              -PuseCommitHashAsVersionName=true \
              --console=plain --stacktrace
            fi

          fi

      # Upload maven artifacts to be used later by the deploy job
      - name: Upload maven artifacts
        if: matrix.deploy==true
        uses: actions/upload-artifact@v7
        with:
          name: maven
          path: dist/maven

      - name: Upload javadoc
        if:  matrix.deploy==true
        uses: actions/upload-artifact@v7
        with:
          name: javadoc
          path: dist/javadoc

      # Upload release archive to be used later by the deploy job
      - name: Upload release
        if: github.event_name == 'release' && matrix.deploy==true
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/release

  # This job deploys snapshots on the master branch
  DeployJavaSnapshot:
    needs: [BuildJMonkey]
    name: Deploy Java Snapshot
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'master'
    permissions:
      contents: read
    steps:

      # We need to clone everything again for publishing ...
      - name: Clone the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Setup jdk 25 used for building Maven-style artifacts
      - name: Setup the java environment
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Rebuild the maven artifacts and upload them to Sonatype's maven-snapshots repo
        env:
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ "${ORG_GRADLE_PROJECT_centralUsername}" = "" ] || \
             [ "${ORG_GRADLE_PROJECT_centralPassword}" = "" ] || \
             [ "${ORG_GRADLE_PROJECT_signingKey}" = "" ] || \
             [ "${ORG_GRADLE_PROJECT_signingPassword}" = "" ];
          then
            echo "Configure the following secrets to enable uploading to Sonatype:"
            echo "CENTRAL_PASSWORD, CENTRAL_USERNAME, SIGNING_KEY, SIGNING_PASSWORD"
          else
            # Retry with backoff to absorb transient Maven Central failures
            # (e.g. HTTP 429 Too Many Requests during dependency resolution).
            for attempt in 1 2 3; do
              echo "publishToSonatype attempt $attempt of 3"
              if ./gradlew publishToSonatype --console=plain --stacktrace; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "publishToSonatype failed after 3 attempts."
                exit 1
              fi
              sleep $((attempt * 30))
            done
          fi


  # This job deploys the release
  DeployRelease:
    needs: [BuildJMonkey]
    name: Deploy Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:

      # We need to clone everything again for publishing ...
      - name: Clone the repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      # Setup jdk 25 used for building Sonatype artifacts
      - name: Setup the java environment
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Download all the stuff...
      - name: Download maven artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: maven
          path: dist/maven

      - name: Download release
        uses: actions/download-artifact@v8.0.1
        with:
          name: release
          path: dist/release

      - name: Rebuild the maven artifacts and close the Sonatype staging repository
        env:
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ "${ORG_GRADLE_PROJECT_centralUsername}" = "" ] || \
             [ "${ORG_GRADLE_PROJECT_centralPassword}" = "" ] || \
             [ "${ORG_GRADLE_PROJECT_signingKey}" = "" ] || \
             [ "${ORG_GRADLE_PROJECT_signingPassword}" = "" ];
          then
            echo "Configure the following secrets to enable uploading to Sonatype:"
            echo "CENTRAL_PASSWORD, CENTRAL_USERNAME, SIGNING_KEY, SIGNING_PASSWORD"
          else
            ./gradlew publishToSonatype closeSonatypeStagingRepository \
              -PuseCommitHashAsVersionName=true \
              --console=plain --stacktrace
          fi

      - name: Deploy to GitHub Releases
        run: |
          # We need to get the release id (yeah, it's not the same as the tag)
          echo "${GITHUB_EVENT_PATH}"
          cat ${GITHUB_EVENT_PATH}
          releaseId=$(jq --raw-output '.release.id' ${GITHUB_EVENT_PATH})

          # Now that we have the id, we just upload the release zip from before
          echo "Upload to release $releaseId"
          filename="$(ls dist/release/*.zip)"
          url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$releaseId/assets?name=$(basename $filename)"
          echo "Upload to $url"
          curl -L \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/zip" \
          --data-binary @"$filename" \
          "$url"

      - name: Deploy to github package registry
        run: |
          source .github/actions/tools/uploadToMaven.sh
          registry="https://maven.pkg.github.com/$GITHUB_REPOSITORY"
          echo "Deploy to github package registry $registry"
          uploadAllToMaven dist/maven/ $registry "token" ${{ secrets.GITHUB_TOKEN }}

  # Deploy the javadoc
  DeployJavaDoc:
    needs: [BuildJMonkey]
    name: Deploy Javadoc
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:

      # We are going to need a deploy key for this, since we need
      # to push to a different repo
      - name: Set ssh key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.JAVADOC_GHPAGES_DEPLOY_PRIVKEY }}" > $HOME/.ssh/deploy.key
          chmod 600 $HOME/.ssh/deploy.key

      # We clone the javadoc repo
      - name: Clone gh-pages
        run: |
          branch="gh-pages"
          export GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy.key"
          git clone --single-branch --branch "$branch" git@github.com:${{ secrets.JAVADOC_GHPAGES_REPO }} .

      # Download the javadoc in the new directory "newdoc"
      - name: Download javadoc
        uses: actions/download-artifact@v8.0.1
        with:
          name: javadoc
          path: newdoc

      # The actual deploy
      - name: Deploy to github pages
        run: |
          set -f
          IFS=$'\n'

          # Get the tag for this release
          version="`if [[ $GITHUB_REF == refs\/tags* ]]; then echo ${GITHUB_REF//refs\/tags\//}; fi`"

          # If there is no tag, then we do nothing.
          if [ "$version" != "" ];
          then
            echo "Deploy as $version"

            # Remove any older version of the javadoc for this tag
            if [ -d "$version" ];then rm -Rf "$version"; fi

            # Rename newdoc with the version name
            mv newdoc "$version"

            # if there isn't an index.txt we create one (we need this to list the versions)
            if [ ! -f "index.txt" ]; then echo "" > index.txt ; fi
            index="`cat index.txt`"

            # Check if this version is already in index.txt
            addNew=true
            for v in $index;
            do
              if [ "$v" = "$version" ];
              then
                echo "$v" "$version"
                addNew=false
                break
              fi
            done

            # If not, we add it to the beginning
            if [ "$addNew" = "true" ];
            then
              echo -e "$version\n$index" > index.txt
              index="`cat index.txt`"
            fi

            # Regenerate the pages
            chmod +x make.sh
            ./make.sh

            # Configure git to use the deploy key
            export GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy.key"

            # Commit the changes
            git config --global user.name "Github Actions"
            git config --global user.email "actions@users.noreply.github.com"

            git add . || true
            git commit -m "$version" || true

            branch="gh-pages"
            git push origin "$branch" --force || true

          fi
