name: Summarise a screenshot comparison
description: >
  Writes the result of a screenshot comparison to the job summary, and records it in results_dir
  for screenshot-comment.yml to turn into a pull request comment. Shared by the desktop and Android
  workflows so that both report the same way.

  results_dir holds plain data only - never markdown - because this runs in the pull request's own
  context, so whatever it writes is untrusted by the time the comment workflow reads it.

inputs:
  platform:
    description: What ran, e.g. "desktop (opengl)" or "android".
    required: true
  reference_ref:
    description: The ref the reference images were generated from.
    required: true
  target_ref:
    description: The commit under test.
    required: true
  reference_images:
    description: Directory holding the reference images the comparison used.
    required: true
  changed_images:
    description: Directory the comparison wrote differing and new images to.
    required: true
  artifact_name:
    description: Name of the uploaded artifact holding the report and the images.
    required: true
  report_file:
    description: The file to open within that artifact to see the differences.
    required: true
  outcome:
    description: >
      The comparison step's outcome, or "unsupported" if the reference ref cannot generate reference
      images. Image differences do not fail it, so anything else but "success" means the comparison
      did not run to the end.
    required: true
  results_dir:
    description: Directory to record the result in.
    required: true

runs:
  using: composite
  steps:
    - name: Write the job summary
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        REFERENCE_REF: ${{ inputs.reference_ref }}
        TARGET_REF: ${{ inputs.target_ref }}
        REFERENCE_IMAGES: ${{ inputs.reference_images }}
        CHANGED_IMAGES: ${{ inputs.changed_images }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        REPORT_FILE: ${{ inputs.report_file }}
        OUTCOME: ${{ inputs.outcome }}
        RESULTS_DIR: ${{ inputs.results_dir }}
      run: |
        set -uo pipefail

        mkdir -p "$RESULTS_DIR"
        printf '%s\n' "$OUTCOME" > "$RESULTS_DIR/outcome"
        printf '%s\n' "$REFERENCE_REF" > "$RESULTS_DIR/reference_ref"
        printf '%s\n' "$TARGET_REF" > "$RESULTS_DIR/target_ref"
        : > "$RESULTS_DIR/changed.txt"
        : > "$RESULTS_DIR/new.txt"
        : > "$RESULTS_DIR/scenario_mismatch.txt"

        # Every image the comparison took issue with is written to the changed-images directory.
        # One that has no counterpart among the reference images belongs to a test that does not
        # exist on the reference branch, so it is new rather than changed.
        if [ -d "$CHANGED_IMAGES" ]; then
          while IFS= read -r image; do
            name=$(basename "$image")
            if [[ "$name" == *_scenario-mismatch.png ]]; then
              echo "$name" >> "$RESULTS_DIR/scenario_mismatch.txt"
            elif [ -f "$REFERENCE_IMAGES/$name" ]; then
              echo "$name" >> "$RESULTS_DIR/changed.txt"
            else
              echo "$name" >> "$RESULTS_DIR/new.txt"
            fi
          done < <(find "$CHANGED_IMAGES" -type f -name '*.png' | sort)
        fi

        changed=$(grep -c . "$RESULTS_DIR/changed.txt" || true)
        new=$(grep -c . "$RESULTS_DIR/new.txt" || true)
        mismatched=$(grep -c . "$RESULTS_DIR/scenario_mismatch.txt" || true)
        table() { echo "| Image |"; echo "| --- |"; sed 's/.*/| `&` |/' "$1"; echo; }

        {
          echo "## Screenshot comparison - $PLATFORM"
          echo
          echo "Both sets of images were rendered on this runner, so any difference below was"
          echo "caused by the code rather than by the hardware."
          echo
          echo "| | |"
          echo "| --- | --- |"
          echo "| Under test | \`$TARGET_REF\` |"
          echo "| Compared against | \`$REFERENCE_REF\` |"
          echo

          if [ "$OUTCOME" = "unsupported" ]; then
            echo "**Nothing was compared** - \`$REFERENCE_REF\` predates generating reference images in"
            echo "CI, so there is nothing to compare against."
            echo
          elif [ "$OUTCOME" != "success" ] && [ "$mismatched" -gt 0 ]; then
            echo "🚨 **Serious visual failure** - tests whose scenarios must render identically rendered"
            echo "differently. This is never an intended change, and has to be fixed."
            echo
            table "$RESULTS_DIR/scenario_mismatch.txt"
          elif [ "$OUTCOME" != "success" ]; then
            echo "❌ **The comparison failed and did not run to the end** - look at the step log above rather than"
            echo "at the images. A crashed or timed out test, or a failed reference run, looks like this."
            echo
          elif [ "$changed" -eq 0 ] && [ "$new" -eq 0 ]; then
            echo "Every screenshot matched its reference image."
            echo
          fi

          if [ "$changed" -gt 0 ]; then
            echo "### $changed image(s) changed"
            echo
            echo "Changed images do not fail this check. They are listed in a comment on the pull"
            echo "request so that the reviewer can confirm the change was intended."
            echo
            table "$RESULTS_DIR/changed.txt"
            echo "Download the **$ARTIFACT_NAME** artifact from this run and open"
            echo "\`$REPORT_FILE\` to see each difference side by side."
            echo
          fi

          if [ "$new" -gt 0 ]; then
            echo "### $new new image(s)"
            echo
            echo "These tests do not exist on \`$REFERENCE_REF\`, so there was nothing to compare"
            echo "them against."
            echo
            table "$RESULTS_DIR/new.txt"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
