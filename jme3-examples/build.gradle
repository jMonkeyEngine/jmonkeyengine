import org.gradle.jvm.toolchain.JavaLanguageVersion
import org.gradle.jvm.toolchain.JvmVendorSpec

import groovy.json.JsonOutput
import java.nio.file.FileSystems
import java.nio.file.Files
import java.security.MessageDigest

plugins {
    id 'org.graalvm.buildtools.native' version '1.1.14'
}

ext.mainClassName = 'jme3test.TestChooser'
ext.nativeMainClassName = 'jme3test.TestChooserCli'
ext.jmeNativeImageAdditionalResourceGlobs = []

def generatedTestChooserResourcesDir = layout.buildDirectory.dir('generated/testchooser/resources')
def testChooserClassListFile = generatedTestChooserResourcesDir.map { it.file('jme3test/test-classes.txt') }
def testChooserReflectionConfigFile = layout.buildDirectory.file('generated/testchooser/reflect-config.json')
def nativeImageBuildOutputJsonFile = layout.buildDirectory.file('reports/native-image/jme3-testchooser-build-output.json')
def testChooserReachabilityMetadataFile = generatedTestChooserResourcesDir.map {
    it.file('META-INF/native-image/org.jmonkeyengine/jme3-examples-testchooser/reachability-metadata.json')
}

tasks.register('generateTestChooserClassList') {
    group = 'build'
    description = 'Generates a resource list of jme3test classes for TestChooserCli fallback discovery.'
    dependsOn 'compileJava'
    inputs.files(sourceSets.main.output.classesDirs)
    outputs.files(testChooserClassListFile, testChooserReachabilityMetadataFile, testChooserReflectionConfigFile)

    doLast {
        Set<String> allJme3TestClassNames = new TreeSet<String>()
        Set<String> launcherClassNames = new TreeSet<String>()
        sourceSets.main.output.classesDirs.files.findAll { it.exists() }.each { classesDir ->
            fileTree(classesDir).matching {
                include 'jme3test/**/*.class'
                exclude '**/*$*'
                exclude '**/module-info.class'
                exclude '**/package-info.class'
                exclude '**/TestChooser.class'
                exclude '**/TestChooserCli.class'
            }.files.each { classFile ->
                String relativePath = classesDir.toPath().relativize(classFile.toPath()).toString().replace(File.separatorChar, (char) '/')
                if (relativePath.endsWith('.class')) {
                    String className = relativePath.substring(0, relativePath.length() - '.class'.length()).replace('/', '.')
                    allJme3TestClassNames.add(className)
                    if (relativePath.contains('Test')) {
                        launcherClassNames.add(className)
                    }
                }
            }
        }

        File classListFile = testChooserClassListFile.get().asFile
        classListFile.parentFile.mkdirs()
        classListFile.text = launcherClassNames.isEmpty()
                ? ''
                : launcherClassNames.join(System.lineSeparator()) + System.lineSeparator()

        List<Map<String, Object>> reflectionEntries = allJme3TestClassNames.collect { className ->
            [
                name: className,
                allDeclaredConstructors: true,
                allDeclaredMethods: true,
                allDeclaredFields: true
            ]
        }
        File reflectionConfigFile = testChooserReflectionConfigFile.get().asFile
        reflectionConfigFile.parentFile.mkdirs()
        reflectionConfigFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(reflectionEntries)) + System.lineSeparator()

        File reachabilityMetadataFile = testChooserReachabilityMetadataFile.get().asFile
        reachabilityMetadataFile.parentFile.mkdirs()
        reachabilityMetadataFile.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            reflection: [[
                condition: [typeReachable: 'jme3test.TestChooserCli'],
                type: '.*',
                allDeclaredConstructors: true,
                allDeclaredMethods: true,
                allDeclaredFields: true
            ]]
        ])) + System.lineSeparator()
    }
}

tasks.named('processResources') {
    dependsOn 'generateTestChooserClassList'
    from(generatedTestChooserResourcesDir)
}

graalvmNative {
    binaries {
        named('main') {
            mainClass = nativeMainClassName
            imageName = 'jme-testchooser'
            buildArgs.add('--no-fallback')
            buildArgs.add('-H:+ReportExceptionStackTraces')
            buildArgs.add('-H:+AddAllCharsets')
            buildArgs.add('-H:+UnlockExperimentalVMOptions')
            buildArgs.add('-H:+ReportUnsupportedElementsAtRuntime')
            buildArgs.add('--enable-url-protocols=http,https')
            buildArgs.add('-H:ConfigurationFileDirectories=' + testChooserReflectionConfigFile.get().asFile.parent)
            buildArgs.add('-H:ConfigurationFileDirectories=' + testChooserReachabilityMetadataFile.get().asFile.parentFile.parentFile.parentFile.parentFile)
            buildArgs.add('-H:BuildOutputJSONFile=' + nativeImageBuildOutputJsonFile.get().asFile)
        }
    }
}

// Native Image builds need all classes and resources available from the examples project.
sourceSets.main.runtimeClasspath += files(sourceSets.main.output)

// Use the generated reflection metadata for native-image builds.
tasks.named('nativeCompile') {
    dependsOn 'generateTestChooserClassList'
}

apply plugin: 'java-library'
apply plugin: 'application'

application {
    mainClass = mainClassName
}

// All examples and supporting modules are included as dependencies.
dependencies {
    implementation project(':jme3-core')
    implementation project(':jme3-desktop')
    implementation project(':jme3-lwjgl3')
    implementation project(':jme3-plugins')
    implementation project(':jme3-terrain')
    implementation project(':jme3-effects')
    implementation project(':jme3-jogg')
    implementation project(':jme3-jbullet')
    implementation project(':jme3-niftygui')
    implementation project(':jme3-networking')
    implementation project(':jme3-awt-dialogs')
    implementation libs.jme3.testdata
    runtimeOnly libs.nifty.examples // for the "all/intro.xml" example GUI
}

jar.doFirst{
    manifest {
        attributes('Manifest-Version'       : '1.0',
//                'Created-By'             : vendor,
//                'Specification-Title'    : appName,
//                'Specification-Version'  : jmeVersion,
//                'Specification-Vendor'   : "jMonkeyEngine",
//                'Implementation-Title'   : appName,
//                'Implementation-Version' : version,
//                'Implementation-Vendor'  : vendor,
                'Main-Class'             : getProperty('mainClassName'),
                // Add dependencies to manifest, remove version
                'Class-Path'             : configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
                                                        'lib/' +
                                                        it.name +
                                                        (it.classifier != null ? '-' + it.classifier : '') +
                                                        '.' + it.extension }.join(' ')
        )
    }
}

task dist (dependsOn: ['build', ':jme3-android:jar']) {
    doLast {
        // Copy all dependencies to ../dist/lib, remove versions from jar files
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            copy {
                from artifact.file
                into '../dist/lib'
                if(artifact.classifier != null){
                    rename { "${artifact.name}-${artifact.classifier}.${artifact.extension}" }
                } else{
                    rename { "${artifact.name}.${artifact.extension}" }
                }
            }
        }
        copy {
            from tasks.named('jar').flatMap { it.archiveFile }
            into '../dist'
            rename { "jMonkeyEngine3.jar" }
        }

        // Copy android packages, remove version
        copy {
            from androidProject.tasks.named('jar').flatMap { it.archiveFile }
            into '../dist/opt/android'
            rename { androidProject.name + ".jar" }
        }
        def androidNativeDependency = libs.jme3.android.natives.get()
        def androidNativeArtifact = androidProject.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == androidNativeDependency.module.group && it.name == androidNativeDependency.module.name
        }
        if (androidNativeArtifact == null) {
            throw new GradleException("Unable to resolve ${androidNativeDependency.module} for the distribution")
        }
        copy {
            from androidNativeArtifact.file
            into '../dist/opt/android'
            rename { androidNativeArtifact.name + ".${androidNativeArtifact.extension}" }
        }
    }
}
